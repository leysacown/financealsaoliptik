<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Tracker by Oliv and Alsa</title>
  <link rel="preconnect" href="https://fonts.gooleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
  <h2>✨Finance Tracker by Oliv and Alsa✨</h2>
    
  <div class="balance-box">
  <h3>Total Saldo: Rp <span id="balance">0</span></h3>
  </div>

    <div class="form-card">
  <input type="text" id="desc" placeholder="Keterangan (contoh: Gaji, Makan, dll.)">
  <input type="number" id="amount" placeholder="Jumlah (minus untuk pengeluaran, mis: -50000)">
  <button onclick="addTransaction()">🌸 Tambahkan Transaksi</button>

  <h3>Riwayat Transaksi</h3>
  <ul id="list"></ul>

  <script src="script.js"></script>
</body>
</html>
